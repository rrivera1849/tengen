name: KataGo runtime

# Builds KataGo for Apple Silicon with its Metal backend (KataGo publishes no
# Mac binaries), adds a network, and publishes both as the `katago-runtime`
# release with a manifest of SHA-256 checksums. Tengen downloads from there.
# Run it by hand from the Actions tab when KataGo or the network should change.

on:
  workflow_dispatch:
    inputs:
      katago_tag:
        description: KataGo release tag to build
        default: v1.16.5
      model_url:
        description: Network to bundle (.bin.gz). Empty picks the latest b18 network from katagotraining.org.
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        # The Metal backend's CoreML converter needs protobuf and abseil
        # (KataGo's Compiling.md); dylibbundler makes the result self-contained.
        run: brew install ninja protobuf abseil pkgconf dylibbundler

      - name: Build KataGo with Metal
        run: |
          git clone --depth 1 --branch "${{ inputs.katago_tag }}" https://github.com/lightvector/KataGo katago-src
          cd katago-src/cpp
          cmake -G Ninja -DUSE_BACKEND=METAL -DNO_GIT_REVISION=1 -DCMAKE_BUILD_TYPE=Release .
          ninja katago

      - name: Bundle its libraries
        # Homebrew's protobuf and abseil are shared libraries, so copy them
        # into runtime/lib, point katago at them, and re-sign everything:
        # Apple Silicon won't run modified code without a signature.
        run: |
          mkdir -p runtime
          cp katago-src/cpp/katago runtime/katago
          cd runtime
          dylibbundler -od -b -x katago -d lib/ -p @executable_path/lib/
          codesign --force --sign - lib/*.dylib katago
          otool -L katago
          if otool -L katago lib/*.dylib | grep -E '/opt/homebrew|/usr/local'; then
            echo "Still linked to Homebrew; the binary wouldn't run on other Macs." >&2
            exit 1
          fi
          tar -czf ../katago-runtime.tar.gz katago lib

      - name: Fetch the network
        run: |
          url="${{ inputs.model_url }}"
          if [ -z "$url" ]; then
            url=$(curl -fsSL https://katagotraining.org/networks/ \
              | grep -o 'https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b18c384nbt-[^"]*\.bin\.gz' \
              | head -1)
          fi
          if [ -z "$url" ]; then
            echo "Couldn't find a b18 network; run again with model_url set." >&2
            exit 1
          fi
          echo "MODEL_URL=$url" >> "$GITHUB_ENV"
          curl -fL "$url" -o model.bin.gz

      - name: Smoke test
        # macOS has no `timeout` command; GitHub stops the step instead.
        # The first start converts the network for the Neural Engine.
        timeout-minutes: 25
        run: |
          mkdir -p logs
          # The same settings Tengen writes (crates/tengen-ai/src/runtime.rs).
          cat > smoke.cfg <<'EOF'
          logDir = logs
          reportAnalysisWinratesAs = BLACK
          maxVisits = 400
          numAnalysisThreads = 2
          numSearchThreadsPerAnalysisThread = 8
          nnMaxBatchSize = 64
          nnCacheSizePowerOfTwo = 21
          nnMutexPoolSizePowerOfTwo = 16
          nnRandomize = true
          EOF
          echo '{"id":"smoke","moves":[["B","E5"]],"rules":"japanese","komi":7,"boardXSize":9,"boardYSize":9,"maxVisits":20}' \
            | ./runtime/katago analysis -config smoke.cfg -model model.bin.gz > answer.json
          cat answer.json
          grep -q '"rootInfo"' answer.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/katago-runtime"
          sha() { shasum -a 256 "$1" | cut -d' ' -f1; }
          cat > manifest.json <<EOF
          {
            "version": "${{ inputs.katago_tag }}",
            "files": [
              { "name": "katago-runtime.tar.gz", "url": "$base/katago-runtime.tar.gz", "sha256": "$(sha katago-runtime.tar.gz)", "archive": true },
              { "name": "model.bin.gz", "url": "$base/model.bin.gz", "sha256": "$(sha model.bin.gz)" }
            ]
          }
          EOF
          cat manifest.json
          gh release delete katago-runtime --yes --cleanup-tag || true
          gh release create katago-runtime katago-runtime.tar.gz model.bin.gz manifest.json \
            --title "KataGo runtime" --latest=false \
            --notes "KataGo ${{ inputs.katago_tag }} built with the Metal backend for Apple Silicon, with the network from $MODEL_URL. Tengen downloads these on first use."
