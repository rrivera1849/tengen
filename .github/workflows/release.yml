name: Release

# Publishes a release whenever main carries a version that hasn't been
# released yet: bump the version in package.json, Cargo.toml and
# tauri.conf.json, push, and this builds Tengen for Apple Silicon, tags
# v<version>, and publishes the release with the .dmg attached. Pushing a
# tag like v1.0.0 by hand does the same. Release notes come from
# docs/releases/v<version>.md when that file exists.

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

# One at a time, so a tag and a push of the same version can't both publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: Is this version released?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p 'require("./package.json").version')
          for v in \
            "$(node -p 'require("./src-tauri/tauri.conf.json").version')" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; do
            if [ "$v" != "$version" ]; then
              echo "Versions disagree: package.json says $version, another file says $v" >&2
              exit 1
            fi
          done
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$version is already released"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: check
    if: needs.check.outputs.needed == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Check OGS sign-in is configured
        run: |
          if ! grep -q '^ogs_client_id = "[A-Za-z0-9]' tengen.toml; then
            echo "tengen.toml has no OGS client ID; OGS sign-in wouldn't work" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo test
      - run: npm test

      - name: Build
        # Unsigned: the README explains opening it the first time.
        run: npm run tauri build -- --bundles app,dmg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          # The workspace builds into target/ at the repository root.
          dmg=$(ls target/release/bundle/dmg/*.dmg src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$dmg" ]; then
            echo "No .dmg was built" >&2
            exit 1
          fi
          name="Tengen-$VERSION-AppleSilicon.dmg"
          cp "$dmg" "$name"
          notes="docs/releases/v$VERSION.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "v$VERSION" "$name" --target "$GITHUB_SHA" \
            --title "Tengen $VERSION" --latest "$@"
