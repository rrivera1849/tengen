[package]
name = "tengen"
description = "A calm place to play and review Go on any server"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "tengen_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tengen-core.workspace = true
tengen-ogs.workspace = true
tengen-kgs.workspace = true
tengen-igs.workspace = true
tengen-ai.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Sign-in tokens live in the macOS Keychain (and Windows Credential Manager later).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
