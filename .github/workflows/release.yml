name: Release

# Pushing a tag like v1.0.0 builds Tengen for Apple Silicon and publishes it
# as a GitHub release with the .dmg attached. The tag must match the version
# in package.json, Cargo.toml and tauri.conf.json. Release notes come from
# docs/releases/<tag>.md when that file exists.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for v in \
            "$(node -p 'require("./package.json").version')" \
            "$(node -p 'require("./src-tauri/tauri.conf.json").version')" \
            "$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"; do
            if [ "$v" != "$tag" ]; then
              echo "Tag $GITHUB_REF_NAME doesn't match version $v" >&2
              exit 1
            fi
          done
          if ! grep -q '^ogs_client_id = "[A-Za-z0-9]' tengen.toml; then
            echo "tengen.toml has no OGS client ID; OGS sign-in wouldn't work" >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: cargo test
      - run: npm test

      - name: Build
        # Unsigned: the README explains opening it the first time.
        run: npm run tauri build -- --bundles app,dmg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg=$(ls src-tauri/target/release/bundle/dmg/*.dmg | head -1)
          name="Tengen-${GITHUB_REF_NAME#v}-AppleSilicon.dmg"
          cp "$dmg" "$name"
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" "$name" --title "Tengen ${GITHUB_REF_NAME#v}" --notes-file "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" "$name" --title "Tengen ${GITHUB_REF_NAME#v}" --generate-notes --latest
          fi
